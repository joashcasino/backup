services:
  db:
    image: postgres:16
    container_name: myfinder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - myfinder_pgdata:/var/lib/postgresql/data

volumes:
  myfinder_pgdata: